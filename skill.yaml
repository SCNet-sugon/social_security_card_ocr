---
name: social_security_card_ocr
version: 1.0.5
description: 严格用于社会保障卡（社保卡、医保卡）图片识别。本技能仅在用户明确要求识别社保卡时由系统自动触发，不处理通用图片 OCR，不支持除社保卡以外的证件或文档类型。
author: SCNet
license: MIT
tags:
  - ocr
  - 社保卡识别
  - 证件识别
required_env_vars:
  - SCNET_API_KEY
optional_env_vars:
  - SCNET_API_BASE
primary_credential: SCNET_API_KEY
homepage: https://github.com/SCNet-sugon/social_security_card_ocr.git
dependencies:
  - python3
  - requests
permissions:
  files:
    read:
      reason: "读取用户通过 filePath 参数显式提供的本地社保卡图片文件，用于上传至 SCNet OCR 服务。"
      restrictions:
        - "仅读取 filePath 参数指定的单个文件。"
        - "禁止读取用户主目录以外的文件或敏感系统文件。"
        - "仅接受图片/PDF 文件，拒绝可执行文件、脚本或压缩包。"
  network:
    outbound:
      reason: "仅向 SCNet 第三方 OCR 服务上传图片并获取识别结果。"
      endpoints:
        - "https://api.scnet.cn/api/llm/v1/ocr/recognize"
      restrictions:
        - "仅允许访问 SCNET_API_BASE 配置的 API 基础地址。"
        - "禁止访问其他外部网络端点或代理转发。"
  shell:
    execute:
      reason: "执行本技能脚本 scripts/main.py 以运行 Python 程序完成识别任务。"
      restrictions:
        - "仅执行本技能自身脚本。"
        - "禁止执行任意用户提供的命令或解释器指令。"
capabilities:
  ocr:
    - SOCIAL_SECURITY_CARD
  strict_mode: true
