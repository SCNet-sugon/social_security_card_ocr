---
name: social_security_card_ocr
version: 1.0.4
description: 严格用于社会保障卡（社保卡、医保卡）图片识别。本技能仅在用户明确要求识别社保卡时由系统自动触发，不处理通用图片 OCR，不支持除社保卡以外的证件或文档类型。
author: SCNet
license: MIT
tags:
  - ocr
  - 社保卡识别
  - 证件识别
required_env_vars:
  - SCNET_API_KEY
optional_env_vars:
  - SCNET_API_BASE
primary_credential: SCNET_API_KEY
homepage: https://github.com/SCNet-sugon/social_security_card_ocr.git
dependencies:
  - python3
  - requests
permissions:
  files:
    - read: "读取用户提供的本地社保卡图片文件，用于上传至 SCNet OCR 服务。仅应读取用户通过 filePath 参数显式指定的图片路径。"
  network:
    - outbound: "向 SCNet 第三方 OCR 服务 api.scnet.cn 上传图片并获取识别结果。除该 API 基础地址外，不应访问其他网络端点。"
  shell:
    - execute: "执行本技能脚本 scripts/main.py 以运行 Python 程序完成识别任务。仅应执行本技能自身脚本，不执行任意用户命令。"
capabilities:
  ocr:
    - SOCIAL_SECURITY_CARD
  strict_mode: true
